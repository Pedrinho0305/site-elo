</head>
<body class="eloa-page">

    <header class="site-header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            ELO
        </div>

        <nav>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Início</a></li>
                <li><a href="instrucoes.html">Instruções</a></li>
                <li><a href="produtos.html">Produto</a></li>
                <li><a href="quem-somos.html">Quem Somos?</a></li>
                <li><a href="referencias.html">Referências</a></li>
                <li><a href="jogo.html">Jogo</a></li>
                <li><a href="eloa.html" class="active">Eloá</a></li>
            </ul>
        </nav>

        <div class="header-controls">
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema">☀️</button>
            <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu">☰</button>
        </div>
    </header>

    <main class="ai-shell">
        <div class="hero-text">Pergunte à Eloá</div>

        <div class="chat-box" id="chat-box" aria-live="polite"></div>

        <div class="composer-wrapper">
            <div class="composer" role="form" aria-label="Conversar com a Eloá">
                <button class="plus-btn" type="button" aria-label="Adicionar conteúdo">+</button>
                <input type="text" id="user-input" placeholder="Pergunte à Eloá" aria-label="Sua mensagem" onkeydown="handleKeyPress(event)">
                <button class="mic-btn" type="button" aria-label="Falar com a Eloá">◌</button>
                <button class="send-btn" type="button" aria-label="Enviar mensagem" onclick="enviarMensagem()">
                    <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        async function enviarMensagem() {
            const input = document.getElementById("user-input");
            const texto = input.value.trim();
            if (!texto) return;

            addMessage(texto, "user");
            input.value = "";

            const msgCarregando = addMessage("Eloá está preparando uma resposta...", "ai");
            msgCarregando.classList.add('is-loading');

            try {
                // AQUI ESTÁ A MUDANÇA: Coloque o seu IP no lugar de "SEU_IP_AQUI"
                // Exemplo de como deve ficar: const response = await fetch("http://192.168.1.15:8000/perguntar", {
                const response = await fetch("https://teste-ia-t66d.onrender.com/perguntar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pergunta: texto })
                });

                const data = await response.json();
                
                if (data.status === "sucesso") {
                    msgCarregando.innerText = data.resposta_da_ia;
                } else {
                    msgCarregando.innerText = data.mensagem || "Ocorreu um erro ao consultar a Eloá.";
                }
            } catch (erro) {
                console.error("Erro no envio:", erro);
                msgCarregando.innerText = "Desculpe, perdi a conexão com o servidor central.";
            }
            msgCarregando.classList.remove('is-loading');
        }

        function addMessage(texto, remetente) {
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = `message ${remetente}`;
            div.innerText = texto;
            box.appendChild(div);
            requestAnimationFrame(() => {
                box.scrollTop = box.scrollHeight;
            });
            return div;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') { e.preventDefault(); enviarMensagem(); }
        }
    </script>

    <footer>
        <div class="logo" style="justify-content: center; margin-bottom: 1rem;">

        </div>
        <p>Conectando cuidadores e idosos com segurança e carinho.</p>
        <p>© 2025 ELO. Todos os direitos reservados.</p>
    </footer>
